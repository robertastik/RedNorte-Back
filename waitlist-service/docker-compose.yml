services:

  # ─────────────────────────────────────────
  # PostgreSQL - Base de datos principal
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rednorte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rednorte_waitlist}
      POSTGRES_USER: ${POSTGRES_USER:-rednorte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rednorte_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rednorte} -d ${POSTGRES_DB:-rednorte_waitlist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rednorte-net

  # ─────────────────────────────────────────
  # Zookeeper - Requerido por Kafka
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: rednorte-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rednorte-net

  # ─────────────────────────────────────────
  # Kafka - Broker de mensajería
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rednorte-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST permite conexión desde el host (Spring Boot local)
      # PLAINTEXT es para comunicación interna entre contenedores
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rednorte-net

  # ─────────────────────────────────────────
  # Kafka UI - Interfaz visual (opcional)
  # Acceso: http://localhost:8090
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rednorte-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rednorte-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - rednorte-net

volumes:
  postgres_data:
    name: rednorte_postgres_data

networks:
  rednorte-net:
    name: rednorte-network
    driver: bridge
