# ===========================
# Application
# ===========================
spring.application.name=waitlist-service
server.port=${SERVER_PORT:8080}

# ===========================
# DataSource & HikariCP
# ===========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rednorte_waitlist}
spring.datasource.username=${DB_USERNAME:rednorte}
spring.datasource.password=${DB_PASSWORD:rednorte_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Formula: (cpu_cores * 2) + spindle_disks
# Default conservador: 2 CPUs + 1 disco = 5 conexiones maximas.
# Sobreescribir en produccion via variables de entorno.
spring.datasource.hikari.pool-name=WaitlistHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Kafka Producer
# ===========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.trusted.packages=com.rmdev.ms_pacientes.kafka.event

# ===========================
# Actuator / Observabilidad
# ===========================
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics
management.endpoint.health.show-details=always

# ===========================
# Resilience4j - Circuit Breaker
# ===========================
resilience4j.circuitbreaker.instances.insuranceValidation.register-health-indicator=true
resilience4j.circuitbreaker.instances.insuranceValidation.sliding-window-size=10
resilience4j.circuitbreaker.instances.insuranceValidation.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.insuranceValidation.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.insuranceValidation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.insuranceValidation.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.insuranceValidation.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.insuranceValidation.slow-call-rate-threshold=80

# ===========================
# Logging
# ===========================
logging.level.com.rmdev.ms_pacientes=INFO
logging.level.org.hibernate.SQL=WARN
